name: PharmaTrace CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmatrace_admin
          POSTGRES_PASSWORD: secure_pharmatrace_pass_2026
          POSTGRES_DB: pharmatrace_db
        ports:
          - 5432:5432
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run Pytest
      env:
        POSTGRES_HOST: localhost
        REDIS_HOST: localhost
        JWT_SECRET_KEY: test_secret_key_for_ci_pipeline
      run: pytest -v